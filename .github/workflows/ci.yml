name: CI

on:
  pull_request:

jobs:
  test:
    name: Run All Tests (Rust & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # From the Ubuntu mirror rather than GitHub release downloads, which intermittently return
      # 504. libsignal's prost build only needs proto2/proto3 support, which 3.21 has.
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          protoc --version

      - name: Start PostgreSQL container
        run: |
          docker run -d \
            --name postgres \
            -p 54321:5432 \
            -e POSTGRES_DB=firefly \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -v ${{ github.workspace }}/initdb.sql:/docker-entrypoint-initdb.d/init.sql \
            postgres:16-alpine

          echo "Waiting for PostgreSQL to become ready..."
          until docker exec postgres pg_isready -U postgres -d firefly; do
            sleep 1
          done
          echo "PostgreSQL is ready!"

      # The server asks a subscription service before creating groups. Its built-in emulator
      # fallback isn't compiled into the published image, so serve the same unlimited plan here.
      - name: Start fake subscription service
        run: |
          nohup bun examples/bots-e2e/fake-subscriptions.ts > /tmp/fake-subscriptions.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8088/lupyd/plans/1/constraints > /dev/null && break
            sleep 0.5
          done

      - name: Pull and start Firefly MLS Server container
        run: |
          docker pull hashtag438/firefly-mls-server:latest
          docker run -d \
            --name firefly-server \
            --network host \
            -v ${{ github.workspace }}/initdb.sql:/app/initdb.sql \
            -v ${{ github.workspace }}/initdb.sql:/initdb.sql \
            --env-file .env.test \
            -e SUBSCRIPTIONS_URL=http://127.0.0.1:8088 \
            -e SUBSCRIPTIONS_AUTHORIZATION="Service test.fake" \
            hashtag438/firefly-mls-server:latest

          echo "Waiting for Firefly MLS Server to start..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:39209/ > /dev/null 2>&1 || curl -s http://127.0.0.1:39209/health > /dev/null 2>&1; then
              echo "Firefly MLS Server is up!"
              break
            fi
            sleep 1
          done
          docker logs firefly-server

      - name: Run Rust tests
        run: |
          export EMULATOR_MODE=true
          export RUST_LOG=info
          export FIREFLY_BASE_URL=http://127.0.0.1:39209
          export FIREFLY_WS_URL=ws://127.0.0.1:39209
          # test-hooks lets the WebTransport tests trust the local server's certificate.
          cargo test --no-fail-fast --features firefly-client/test-hooks

      - name: Build WASM and JS packages
        # Runs even when an earlier test step failed, so one failure doesn't hide the rest.
        if: ${{ !cancelled() }}
        run: |
          cd crates/client-node
          npm install
          npm run build

          cd ../firefly-client-js
          npm install
          npm run build

      - name: Run TypeScript integration tests
        if: ${{ !cancelled() }}
        run: |
          cd examples/chatbot
          npm install
          FIREFLY_BASE_URL=http://127.0.0.1:39209 FIREFLY_WS_URL=ws://127.0.0.1:39209/ SPAWN_SERVER=false bun test

      - name: Run bot and client unit tests
        if: ${{ !cancelled() }}
        run: |
          # Links the bots to the packages built above
          bun examples/bots-setup.ts --skip-wasm
          (cd crates/firefly-client-js && bun test tests/auth.test.ts)
          for dir in greetings-bot reminder-bot bot-storage; do
            (cd examples/$dir && bun test)
          done

      - name: Run bots end-to-end test
        if: ${{ !cancelled() }}
        run: |
          cd examples/bots-e2e
          FIREFLY_BASE_URL=http://127.0.0.1:39209 bun test --timeout 400000

      - name: Dump Docker logs on failure
        if: failure()
        run: |
          echo "=== Postgres Logs ==="
          docker logs postgres || true
          echo "=== Firefly MLS Server Logs ==="
          docker logs firefly-server || true
          echo "=== Fake subscription service ==="
          cat /tmp/fake-subscriptions.log || true
